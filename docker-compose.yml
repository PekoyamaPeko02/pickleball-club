# Local dev stack: PostgreSQL (schema/seed auto-applied on first start) and the API.
#   docker compose up -d db          # database only (run API with `dotnet run`)
#   docker compose up -d             # database + API on http://localhost:5090
# Reset the database: docker compose down -v
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pickleball
      POSTGRES_USER: pickleball
      POSTGRES_PASSWORD: pickleball
    ports:
      - "5434:5432"   # host 5434 so it never clashes with another local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickleball -d pickleball"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: src/PickleballClub.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=pickleball;Username=pickleball;Password=pickleball
    ports:
      - "5090:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
